<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14213d">
<title>Carta para o Mumu</title>
<style>
  :root {
    --navy: #14213d;
    --navy-2: #1d2d50;
    --gold: #d4a64a;
    --gold-soft: #f1dca7;
    --paper: #fbf7ee;
    --ink: #2b2b2b;
    --muted: #6b6457;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--navy);
    color: var(--ink);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- Envelope (tela inicial) ---------- */
  #envelope-screen {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, var(--navy-2), var(--navy));
    color: var(--gold-soft);
    text-align: center; padding: 24px;
    transition: opacity .8s ease, visibility .8s;
  }
  #envelope-screen.hidden { opacity: 0; visibility: hidden; }
  .envelope {
    position: relative; width: min(300px, 80vw); aspect-ratio: 3 / 2;
    background: var(--paper); border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    cursor: pointer; margin: 28px 0;
  }
  .envelope::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent 49.5%, #eadfc6 50%) left / 50% 100% no-repeat,
                linear-gradient(to top left, transparent 49.5%, #eadfc6 50%) right / 50% 100% no-repeat;
    border-radius: 6px;
  }
  .flap {
    position: absolute; top: 0; left: 0; right: 0; height: 60%;
    background: #f3ead5;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .7s ease;
    z-index: 2;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .seal {
    position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%);
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c0392b, #7b1d14);
    color: var(--gold-soft); display: grid; place-items: center;
    font-size: 22px; font-weight: bold; z-index: 3;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    transition: opacity .3s;
  }
  .envelope.open .seal { opacity: 0; }
  .envelope-hint { font-size: .95rem; opacity: .8; animation: pulse 2s infinite; }
  .envelope-title { font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: .5px; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- Layout ---------- */
  section { padding: 64px 20px; }
  .container { max-width: 760px; margin: 0 auto; }
  h2 {
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    text-align: center; margin-bottom: 28px;
    color: var(--navy);
  }
  h2::after {
    content: ""; display: block; width: 60px; height: 3px;
    background: var(--gold); margin: 12px auto 0; border-radius: 2px;
  }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 20%, var(--navy-2), var(--navy) 70%);
    position: relative; overflow: hidden;
  }
  .cap { font-size: 64px; margin-bottom: 8px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  .hero .eyebrow { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: .8rem; }
  .hero h1 { font-size: clamp(2.4rem, 11vw, 4.5rem); line-height: 1.1; margin: 10px 0; }
  .scroll-down {
    position: absolute; bottom: 24px; color: var(--gold-soft);
    font-size: .85rem; text-decoration: none; animation: pulse 2s infinite;
  }

  /* ---------- Manchetes do futuro ---------- */
  .news-section { background: var(--paper); }
  .news-intro { text-align: center; color: var(--muted); margin: -12px 0 24px; }
  .newspaper {
    background: #fffdf7; color: #1a1a1a;
    border-radius: 6px; padding: 18px 18px 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,.12);
    transform: rotate(-1deg);
  }
  .np-head {
    text-align: center; border-bottom: 3px double #1a1a1a; padding-bottom: 8px; margin-bottom: 6px;
  }
  .np-name { font-size: clamp(1.4rem, 6vw, 2rem); font-weight: bold; letter-spacing: 1px; }
  .np-meta {
    display: flex; justify-content: space-between; font-size: .72rem;
    text-transform: uppercase; letter-spacing: 1px; color: #555;
    border-bottom: 1px solid #1a1a1a; padding: 4px 0; margin-bottom: 14px;
  }
  .np-tag {
    display: inline-block; background: #c0392b; color: #fff; font-size: .7rem;
    padding: 2px 8px; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase;
  }
  .np-title {
    font-size: clamp(1.3rem, 5.5vw, 1.9rem); line-height: 1.2; margin: 10px 0 8px;
    min-height: 3.6em;
  }
  .np-sub { font-style: italic; color: #444; font-size: .95rem; }
  .newspaper.flip { animation: flip .5s ease; }
  @keyframes flip {
    0% { transform: rotate(-1deg); }
    40% { transform: rotate(-1deg) rotateX(80deg); opacity: .3; }
    100% { transform: rotate(-1deg); }
  }
  .news-actions { text-align: center; margin-top: 26px; }
  .news-count { display: block; margin-top: 10px; font-size: .8rem; color: var(--muted); }

  /* ---------- Carta ---------- */
  .letter-section { background: var(--paper); }
  .letter {
    background: #fff;
    background-image: repeating-linear-gradient(transparent 0 31px, #ece4d2 31px 32px);
    padding: 36px 26px; border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(20,33,61,.12);
    border-left: 4px solid var(--gold);
    font-size: 1.08rem; line-height: 32px;
  }
  .letter p { margin-bottom: 32px; white-space: pre-line; }
  .letter p:last-of-type { margin-bottom: 0; }
  .signature { text-align: right; margin-top: 32px; font-style: italic; color: var(--navy); }
  .closing { margin-top: 32px; font-weight: bold; color: var(--navy); font-size: 1.15rem; }

  /* ---------- Foguete ---------- */
  .launchpad { text-align: center; margin-top: 32px; }
  .rocket-btn {
    font-size: 3rem; line-height: 1; background: none; border: none; cursor: pointer;
    display: inline-block; transform: rotate(-45deg);
    animation: wobble 1.6s ease-in-out infinite;
  }
  .rocket-btn:disabled { cursor: default; animation: shake .12s linear infinite; }
  .rocket-btn.launched { visibility: hidden; }
  @keyframes shake { 50% { transform: rotate(-45deg) translate(1px, 1px); } }
  @keyframes wobble { 50% { transform: rotate(-45deg) translate(2px, -3px); } }
  .launch-hint { display: block; font-size: .85rem; color: var(--muted); line-height: 1.6; min-height: 1.6em; }
  .launch-hint.counting { font-size: 1.6rem; font-weight: bold; color: #c0392b; }
  .flying-rocket {
    position: fixed; z-index: 80; font-size: 3rem; line-height: 1; pointer-events: none;
    transform: rotate(-45deg); will-change: transform;
  }
  .smoke {
    position: fixed; z-index: 79; pointer-events: none; border-radius: 50%;
    will-change: transform, opacity;
    background: radial-gradient(circle, rgba(255,200,90,.95), rgba(255,120,40,.6) 40%, rgba(200,200,200,.35) 70%, transparent);
    animation: puff 1.1s ease-out forwards;
  }
  @keyframes puff {
    from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
  }

  /* ---------- Fotos: varal + pilha ---------- */
  .gallery-section { background: #f2ece0; overflow: hidden; }
  .photo-hint { text-align: center; color: var(--muted); margin: -12px 0 20px; font-size: .95rem; }

  .varal {
    position: relative; overflow-x: auto; overflow-y: hidden;
    margin: 0 -20px 8px; padding: 0 20px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .varal::-webkit-scrollbar { display: none; }
  .varal-track {
    position: relative; display: flex; gap: 18px; align-items: flex-start;
    min-width: 100%; width: max-content; min-height: 190px; padding: 22px 12px 18px;
  }
  .varal-track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 18px; height: 2px;
    background: #8a6d45; border-radius: 2px; box-shadow: 0 2px 2px rgba(0,0,0,.12);
  }
  .varal-empty {
    position: absolute; left: 50%; top: 70px; transform: translateX(-50%);
    width: 80%; text-align: center; color: var(--muted); font-style: italic; font-size: .9rem;
  }
  .hanging {
    position: relative; flex: none; background: #fff; padding: 6px 6px 18px;
    box-shadow: 0 6px 12px rgba(0,0,0,.18); cursor: zoom-in;
    transform-origin: 50% -10px;
    animation: hang-in .6s cubic-bezier(.3,1.6,.5,1) both, sway 3.2s ease-in-out infinite alternate;
    animation-delay: 0s, var(--d, 0s);
  }
  .hanging img { height: 130px; width: auto; display: block; }
  .hanging::before {
    content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    width: 10px; height: 22px; border-radius: 3px;
    background: linear-gradient(90deg, #c9a46a, #e6c896, #c9a46a);
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  @keyframes hang-in { from { transform: translateY(-60px) rotate(-12deg); opacity: 0; } }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }

  .pile {
    position: relative; height: min(440px, 62svh); margin: 10px auto 0; max-width: 420px;
  }
  .card {
    position: absolute; left: 50%; top: 50%;
    background: #fff; padding: 10px 10px 34px;
    box-shadow: 0 10px 24px rgba(0,0,0,.2);
    transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    transition: transform .35s ease, opacity .35s ease;
    user-select: none; -webkit-user-select: none; touch-action: pan-y;
  }
  .card img {
    display: block; max-width: min(78vw, 340px); max-height: calc(min(440px, 62svh) - 80px);
    width: auto; height: auto; pointer-events: none;
  }
  .card .card-cap {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-style: italic; color: var(--muted); font-size: .85rem;
  }
  .card.top { cursor: grab; }
  .card.dragging { transition: none; cursor: grabbing; }
  .pile-done {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px;
  }
  .pile-done.show { display: flex; }
  .pile-done p { font-size: 1.3rem; color: var(--navy); }
  .pile-actions { text-align: center; margin-top: 18px; }
  .btn-ghost {
    background: none; border: 2px solid var(--navy); color: var(--navy);
    padding: 10px 20px; border-radius: 999px; font: inherit; cursor: pointer;
  }
  .btn-ghost:active { transform: scale(.97); }
  .pile-count { display: block; margin-top: 8px; font-size: .8rem; color: var(--muted); }

  /* ---------- Lightbox ---------- */
  #lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    padding: 16px;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
  #lightbox p { color: #fff; margin-top: 12px; text-align: center; }
  #lightbox button {
    position: absolute; background: none; border: none; color: #fff;
    font-size: 2.2rem; cursor: pointer; padding: 10px 16px;
  }
  #lb-close { top: 8px; right: 8px; }
  #lb-prev { left: 4px; top: 50%; transform: translateY(-50%); }
  #lb-next { right: 4px; top: 50%; transform: translateY(-50%); }

  /* ---------- Final ---------- */
  .final {
    background: var(--navy); color: #fff; text-align: center;
    padding: 72px 20px 48px;
  }
  .final h2 { color: #fff; }
  .final p { max-width: 560px; margin: 0 auto; opacity: .9; }
  .btn {
    margin-top: 28px; display: inline-block;
    background: var(--gold); color: var(--navy); border: none;
    padding: 14px 26px; border-radius: 999px; font: inherit; font-weight: bold;
    cursor: pointer; box-shadow: 0 6px 18px rgba(212,166,74,.35);
  }
  .btn:active { transform: scale(.97); }
  footer { margin-top: 40px; font-size: .8rem; opacity: .6; }

  /* ---------- Animação de entrada ---------- */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  /* ---------- Confete ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<!-- Tela inicial com envelope -->
<div id="envelope-screen">
  <p class="envelope-title" id="env-title"></p>
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir a carta">
    <div class="flap"></div>
    <div class="seal" id="seal-letter"></div>
  </div>
  <p class="envelope-hint">Toque no envelope para abrir</p>
</div>

<main>
  <section class="hero" id="inicio">
    <div class="cap" aria-hidden="true">🎓</div>
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-name"></h1>
    <a href="#carta" class="scroll-down">▼ role para ler</a>
  </section>

  <section class="letter-section" id="carta">
    <div class="container">
      <h2 class="reveal" id="letter-title"></h2>
      <article class="letter reveal">
        <div id="letter-body"></div>
        <p class="closing" id="letter-closing"></p>
        <div class="launchpad">
          <button class="rocket-btn" id="rocket" aria-label="Lançar o foguete">🚀</button>
          <span class="launch-hint" id="launch-hint"></span>
        </div>
        <p class="signature" id="letter-signature"></p>
      </article>
    </div>
  </section>

  <section class="gallery-section" id="fotos">
    <div class="container">
      <h2 class="reveal" id="gallery-title"></h2>
      <p class="photo-hint reveal" id="photo-hint"></p>
      <div class="varal" id="varal">
        <div class="varal-track" id="varal-track">
          <span class="varal-empty" id="varal-empty"></span>
        </div>
      </div>
      <div class="pile" id="pile">
        <div class="pile-done" id="pile-done">
          <p id="pile-done-text"></p>
          <button class="btn-ghost" id="pile-reset">↺ Empilhar de novo</button>
        </div>
      </div>
      <div class="pile-actions">
        <button class="btn-ghost" id="pile-next">Pendurar no varal ↗</button>
        <span class="pile-count" id="pile-count"></span>
      </div>
    </div>
  </section>

  <section class="news-section" id="futuro">
    <div class="container">
      <h2 class="reveal" id="news-title"></h2>
      <p class="news-intro reveal" id="news-intro"></p>
      <div class="newspaper reveal" id="newspaper" aria-live="polite">
        <div class="np-head"><div class="np-name" id="np-name"></div></div>
        <div class="np-meta"><span id="np-edition"></span><span id="np-year"></span></div>
        <span class="np-tag">Urgente</span>
        <h3 class="np-title" id="np-title"></h3>
        <p class="np-sub" id="np-sub"></p>
      </div>
      <div class="news-actions">
        <button class="btn" id="next-news">📰 Próxima manchete</button>
        <span class="news-count" id="news-count"></span>
      </div>
    </div>
  </section>

  <section class="final">
    <div class="container">
      <h2 class="reveal" id="final-title"></h2>
      <p class="reveal" id="final-text"></p>
      <button class="btn" id="celebrate">🎉 Comemorar</button>
      <footer id="footer-text"></footer>
    </div>
  </section>
</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button id="lb-close" aria-label="Fechar">×</button>
  <button id="lb-prev" aria-label="Foto anterior">‹</button>
  <img id="lb-img" alt="">
  <p id="lb-caption"></p>
  <button id="lb-next" aria-label="Próxima foto">›</button>
</div>

<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   CONFIG — edite aqui os textos da carta

const CONFIG = {

  apelido: "Mumu",
  subtitulo: "Formatura 2026",

    "Hoje, olhando para você terminando a escola, vejo aquele menino curioso virando um adulto responsável, que sabe o que quer e corre atrás. Você já fala de investimentos, acompanha o mercado, pensa no futuro com uma maturidade que muita gente bem mais velha ainda não tem. E agora vem o Marketing, que combina demais com você.",

  fotos: [

    { arquivo: "fotos/foto8.jpg", legenda: "" },
    { arquivo: "fotos/foto9.jpg", legenda: "" },

  introManchetes: "Uma prévia exclusiva dos jornais daqui a alguns anos. Toque para ver a próxima.",

    { titulo: "Bolsa sobe 3% depois que Mumu posta um emoji de foguete", sub: "Analistas tentam entender; Mumu diz que estava só comemorando o almoço." },
    { titulo: "Campanha criada por Mumu é tão boa que até o concorrente compartilha", sub: "Professores de Marketing já usam o caso em sala de aula." },

/* ===================================================================== */

(function () {
  const $ = (id) => document.getElementById(id);

  // Textos
  $("env-title").textContent = CONFIG.tituloEnvelope;
  $("seal-letter").textContent = (CONFIG.apelido || CONFIG.nome).charAt(0).toUpperCase();
  $("hero-eyebrow").textContent = CONFIG.subtitulo;
  $("hero-name").textContent = CONFIG.nome;
  $("letter-title").textContent = CONFIG.tituloCarta;
  $("letter-closing").textContent = CONFIG.fechamento;
  $("launch-hint").textContent = CONFIG.dicaFoguete;
  $("letter-signature").textContent = CONFIG.assinatura;
  $("gallery-title").textContent = CONFIG.tituloGaleria;
  $("news-title").textContent = CONFIG.tituloManchetes;
  $("news-intro").textContent = CONFIG.introManchetes;
  $("np-name").textContent = CONFIG.nomeJornal;
  $("final-title").textContent = CONFIG.tituloFinal;
  $("final-text").textContent = CONFIG.textoFinal;
  $("footer-text").textContent = CONFIG.rodape;
  document.title = `Carta para o ${CONFIG.apelido || CONFIG.nome}`;

  const body = $("letter-body");
  CONFIG.carta.forEach((txt) => {
    const p = document.createElement("p");
    p.textContent = txt;
    body.appendChild(p);
  });

  // Manchetes do futuro: ordem embaralhada, sem repetir até ver todas
  const news = CONFIG.manchetes;
  let order = [];
  let pos = 0;
  let seen = 0;
  function shuffle() {
    order = news.map((_, i) => i).sort(() => Math.random() - 0.5);
    pos = 0;
  }
  function showNews(animate) {
    if (pos >= order.length) shuffle();
    const n = news[order[pos++]];
    const paper = $("newspaper");
    const fill = () => {
      $("np-title").textContent = n.titulo;
      $("np-sub").textContent = n.sub;
      $("np-year").textContent = 2030 + Math.floor(Math.random() * 16);
      $("np-edition").textContent = `Edição nº ${100 + Math.floor(Math.random() * 900)}`;
    };
    if (animate) {
      paper.classList.remove("flip");
      void paper.offsetWidth;
      paper.classList.add("flip");
      setTimeout(fill, 200);
    } else fill();
    seen = Math.min(seen + 1, news.length);
    $("news-count").textContent = seen < news.length
      ? `${seen} de ${news.length} manchetes lidas`
      : "Você leu todas! O futuro é promissor 🚀";
  }
  shuffle();
  showNews(false);
  $("next-news").onclick = () => showNews(true);

  // Fotos: pilha na mesa + varal
  $("photo-hint").textContent = CONFIG.dicaFotos;
  $("varal-empty").textContent = CONFIG.varalVazio;
  $("pile-done-text").textContent = CONFIG.pilhaTerminou;
  const fotosOk = CONFIG.fotos;
  const pileEl = $("pile");
  const track = $("varal-track");
  const varal = $("varal");
  let pile = [];

  function updateCount() {
    const hung = track.querySelectorAll(".hanging").length;
    $("pile-count").textContent = `${hung} de ${fotosOk.length} no varal`;
    $("pile-next").style.visibility = pile.length ? "visible" : "hidden";
    $("pile-done").classList.toggle("show", pile.length === 0);
    $("varal-empty").style.display = hung || pile.length < fotosOk.length ? "none" : "";
  }

  function markTop() {
    pileEl.querySelectorAll(".card").forEach((c) => c.classList.remove("top"));
    if (pile.length) pile[0].el.classList.add("top");
  }

  function buildPile() {
    pileEl.querySelectorAll(".card").forEach((c) => c.remove());
    track.querySelectorAll(".hanging").forEach((h) => h.remove());
    pile = fotosOk.map((f, i) => {
      const el = document.createElement("div");
      el.className = "card";
      el.style.setProperty("--r", `${(Math.random() * 14 - 7).toFixed(1)}deg`);
      el.style.zIndex = fotosOk.length - i;
      const img = document.createElement("img");
      img.src = f.arquivo;
      img.alt = f.legenda || `Foto ${i + 1}`;
      img.draggable = false;
      img.loading = "lazy";
      img.decoding = "async";
      const cap = document.createElement("span");
      cap.className = "card-cap";
      cap.textContent = f.legenda || `${i + 1} / ${fotosOk.length}`;
      el.append(img, cap);
      const item = { el, i };
      img.onerror = () => {
        el.remove();
        pile = pile.filter((p) => p !== item);
        markTop();
        updateCount();
      };
      attachDrag(item);
      pileEl.appendChild(el);
      return item;
    });
    markTop();
    updateCount();
  }

  function hang(i) {
    const f = fotosOk[i];
    const h = document.createElement("figure");
    h.className = "hanging";
    h.style.setProperty("--d", `${(Math.random() * -3).toFixed(2)}s`);
    const img = document.createElement("img");
    img.src = f.arquivo;
    img.alt = f.legenda || `Foto ${i + 1}`;
    h.appendChild(img);
    h.onclick = () => openLightbox(i);
    track.appendChild(h);
    updateCount();
    requestAnimationFrame(() => varal.scrollTo({ left: varal.scrollWidth, behavior: "smooth" }));
  }

  function throwTop(dx, dy) {
    if (!pile.length) return;
    const item = pile.shift();
    const dir = dx === 0 ? 1 : Math.sign(dx);
    item.el.classList.remove("dragging", "top");
    item.el.style.transform =
      `translate(calc(-50% + ${dir * 120}vw), calc(-50% + ${dy - 220}px)) rotate(${dir * 35}deg)`;
    item.el.style.opacity = "0";
    markTop();
    updateCount();
    setTimeout(() => { item.el.remove(); hang(item.i); }, 320);
  }

  function attachDrag(item) {
    const el = item.el;
    let sx = 0, sy = 0, dx = 0, dy = 0, active = false;
    el.addEventListener("pointerdown", (e) => {
      if (pile[0] !== item) return;
      active = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      el.setPointerCapture(e.pointerId);
      el.classList.add("dragging");
    });
    el.addEventListener("pointermove", (e) => {
      if (!active) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      el.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(calc(var(--r) + ${dx / 12}deg))`;
    });
    const end = (cancelled) => {
      if (!active) return;
      active = false;
      el.classList.remove("dragging");
      if (!cancelled && Math.abs(dx) > 80) return throwTop(dx, dy);
      el.style.transform = "";
      if (!cancelled && Math.abs(dx) < 6 && Math.abs(dy) < 6) openLightbox(item.i);
    };
    el.addEventListener("pointerup", () => end(false));
    el.addEventListener("pointercancel", () => end(true));
  }

  $("pile-next").onclick = () => throwTop(1, 0);
  $("pile-reset").onclick = buildPile;
  buildPile();

  // Lightbox
  let current = 0;
  const lb = $("lightbox");
  function showPhoto(i) {
    current = (i + fotosOk.length) % fotosOk.length;
    $("lb-img").src = fotosOk[current].arquivo;
    $("lb-img").alt = fotosOk[current].legenda || `Foto ${current + 1}`;
    $("lb-caption").textContent = fotosOk[current].legenda || "";
  }
  function openLightbox(i) { showPhoto(i); lb.classList.add("show"); }
  function closeLightbox() { lb.classList.remove("show"); }
  $("lb-close").onclick = closeLightbox;
  $("lb-prev").onclick = (e) => { e.stopPropagation(); showPhoto(current - 1); };
  $("lb-next").onclick = (e) => { e.stopPropagation(); showPhoto(current + 1); };
  lb.onclick = (e) => { if (e.target === lb) closeLightbox(); };
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("show")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") showPhoto(current - 1);
    if (e.key === "ArrowRight") showPhoto(current + 1);
  });
  let touchX = null;
  lb.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) showPhoto(current + (dx < 0 ? 1 : -1));
    touchX = null;
  });

  // Revelar ao rolar
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  // Confete
  const canvas = $("confetti");
  const ctx = canvas.getContext("2d");
  let pieces = [];
  let animating = false;
  let last = 0;
  canvas.style.display = "none";
  function resize() {
    if (canvas.width !== innerWidth) canvas.width = innerWidth;
    if (canvas.height !== innerHeight) canvas.height = innerHeight;
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    resize();
    const colors = ["#d4a64a", "#f1dca7", "#ffffff", "#c0392b", "#4a78d4"];
    // Começa logo acima da tela para aparecer na hora
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width, y: -10 - Math.random() * 140,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        vy: 2.5 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
        rot: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
        color: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!animating) {
      animating = true;
      canvas.style.display = "block";
      last = performance.now();
      requestAnimationFrame(draw);
    }
  }
  // Velocidades em px por quadro de 60 fps, escaladas pelo tempo real
  // para não ficar em câmera lenta quando o celular perde quadros
  function draw(now) {
    const k = Math.min((now - last) / 16.67, 4);
    last = now;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
      const c = Math.cos(p.rot), s = Math.sin(p.rot);
      ctx.setTransform(c, s, -s, c, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    pieces = pieces.filter((p) => p.y < canvas.height + 30);
    if (pieces.length) requestAnimationFrame(draw);
    else {
      animating = false;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = "none";
    }
  }
  $("celebrate").onclick = confetti;

  // Foguete: contagem 3-2-1 e decolagem até sair da tela
  const rocket = $("rocket");
  const hint = $("launch-hint");
  rocket.onclick = () => {
    rocket.disabled = true;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let n = 3;
    hint.classList.add("counting");
    hint.textContent = n;
    const timer = setInterval(() => {
      n--;
      if (n > 0) { hint.textContent = n; return; }
      clearInterval(timer);
      hint.classList.remove("counting");
      hint.textContent = CONFIG.mensagemDecolagem;
      if (reduced) { setTimeout(reset, 2500); return; }
      launch();
    }, 550);

    function launch() {
      const r = rocket.getBoundingClientRect();
      rocket.classList.add("launched");
      const fly = document.createElement("div");
      fly.className = "flying-rocket";
      fly.textContent = "🚀";
      fly.style.left = r.left + "px";
      fly.style.top = r.top + "px";
      document.body.appendChild(fly);
      if (navigator.vibrate) navigator.vibrate(200);
      // Posição calculada pelo tempo decorrido, com aceleração (ease-in),
      // e movida só com transform para não recalcular o layout a cada quadro
      const dist = r.top + 160;
      const duration = 1100;
      const start = performance.now();
      let lastSmoke = 0;
      function step(now) {
        const t = now - start;
        const p = Math.min(t / duration, 1);
        const dy = -dist * p * p;
        const dx = Math.sin(t / 90) * 5;
        fly.style.transform = `translate3d(${dx}px, ${dy}px, 0) rotate(-45deg)`;
        if (t - lastSmoke > 45 && p < 0.85) {
          lastSmoke = t;
          const s = document.createElement("div");
          const size = 18 + Math.random() * 14;
          s.className = "smoke";
          s.style.width = s.style.height = size + "px";
          s.style.left = r.left + dx + 18 + Math.random() * 10 + "px";
          s.style.top = r.top + dy + r.height + "px";
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1100);
        }
        if (p < 1) requestAnimationFrame(step);
        else { fly.remove(); confetti(); setTimeout(reset, 2500); }
      }
      requestAnimationFrame(step);
    }
    function reset() {
      rocket.disabled = false;
      rocket.classList.remove("launched");
      hint.textContent = CONFIG.dicaFoguete;
    }
  };

  // Envelope
  const env = $("envelope");
  function openEnvelope() {
    env.classList.add("open");
    confetti();
    setTimeout(() => $("envelope-screen").classList.add("hidden"), 600);
  }
  env.addEventListener("click", openEnvelope);
  env.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });
})();
</script>
</body>
</html>
